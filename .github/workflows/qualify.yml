name: Candidate qualification
'on':
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
    secrets: {}
    outputs:
      ready:
        value: ${{ jobs.qualify.outputs.ready }}
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
    outputs:
      ready: ${{ steps.result.outputs.ready }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
    - name: Architecture boundary gate
      run: python3 tools/check_architecture.py && python3 tools/test_architecture.py
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python -m pip install -r .github/release-tools/requirements.txt
    - run: python .github/release-tools/lint_workflows.py
    - run: python -m unittest discover -s .github/release-tools -p "test_*.py" -v
    - run: python .github/release-tools/version.py --tag "$RELEASE_TAG"
      env:
        RELEASE_TAG: ${{ startsWith(inputs.ref, 'refs/tags/') && inputs.ref || startsWith(inputs.ref, 'v') && inputs.ref ||
          '' }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: 1.96.1
        components: rustfmt, clippy
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
    - run: make test test-release
    - run: bash .github/release-tools/check-sdk-consumers.sh
    - run: echo "ready=$READY" >> "$GITHUB_OUTPUT"
      id: result
      env:
        READY: 'true'

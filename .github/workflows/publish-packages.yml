name: Optional registry publishing
'on':
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
      channel:
        type: choice
        options:
        - all
        - npm
        - pypi
        - crates
        default: all
      publish:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: registry-${{ inputs.tag }}-${{ inputs.channel }}
  cancel-in-progress: false
jobs:
  qualify:
    uses: ./.github/workflows/qualify.yml
    with:
      ref: ${{ inputs.tag }}
    secrets: inherit
  npm:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.tag }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - id: policy
      run: python .github/release-tools/publication.py
      env:
        MIILO_PUBLISH: ${{ inputs.publish && (inputs.channel == 'all' || inputs.channel == 'npm') }}
        RELEASE_TOKEN: ${{ vars.MIILO_NPM_TRUSTED_PUBLISHER == 'true' && 'oidc-configured' || secrets.NPM_TOKEN }}
        DEPENDENCIES_READY: ${{ needs.qualify.outputs.ready == 'true' && github.event.repository.private == false }}
    - if: steps.policy.outputs.publish == 'true'
      run: python .github/release-tools/version.py --tag "$TAG"
      env:
        TAG: ${{ inputs.tag }}
    - if: steps.policy.outputs.publish == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        registry-url: https://registry.npmjs.org
    - if: steps.policy.outputs.publish == 'true'
      run: |-
        gh release download "$TAG" --pattern "miilo-ai-adapter-sdk-*.tgz" --dir registry-payload
        npm publish registry-payload/*.tgz --access public --provenance
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.tag }}
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  pypi:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.tag }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - id: policy
      run: python .github/release-tools/publication.py
      env:
        MIILO_PUBLISH: ${{ inputs.publish && (inputs.channel == 'all' || inputs.channel == 'pypi') }}
        RELEASE_TOKEN: ${{ vars.MIILO_PYPI_TRUSTED_PUBLISHER == 'true' && 'oidc-configured' || secrets.PYPI_TOKEN }}
        DEPENDENCIES_READY: ${{ needs.qualify.outputs.ready == 'true' && github.event.repository.private == false }}
    - if: steps.policy.outputs.publish == 'true'
      run: python .github/release-tools/version.py --tag "$TAG"
      env:
        TAG: ${{ inputs.tag }}
    - if: steps.policy.outputs.publish == 'true'
      run: gh release download "$TAG" --pattern "*.whl" --pattern "miilo_adapter_sdk-*.tar.gz" --dir registry-payload
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.tag }}
    - if: steps.policy.outputs.publish == 'true'
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
      with:
        packages-dir: registry-payload/
        password: ${{ secrets.PYPI_TOKEN }}
        attestations: ${{ vars.MIILO_PYPI_TRUSTED_PUBLISHER == 'true' }}
  crates:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.tag }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - id: policy
      run: python .github/release-tools/publication.py
      env:
        MIILO_PUBLISH: ${{ inputs.publish && (inputs.channel == 'all' || inputs.channel == 'crates') }}
        RELEASE_TOKEN: ${{ vars.MIILO_CRATES_TRUSTED_PUBLISHER == 'true' && 'oidc-configured' || secrets.CARGO_REGISTRY_TOKEN
          }}
        DEPENDENCIES_READY: ${{ needs.qualify.outputs.ready == 'true' && github.event.repository.private == false }}
    - if: steps.policy.outputs.publish == 'true'
      run: python .github/release-tools/version.py --tag "$TAG"
      env:
        TAG: ${{ inputs.tag }}
    - if: steps.policy.outputs.publish == 'true'
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: 1.96.1
    - if: steps.policy.outputs.publish == 'true' && vars.MIILO_CRATES_TRUSTED_PUBLISHER == 'true'
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      id: crates-auth
    - if: steps.policy.outputs.publish == 'true'
      run: |-
        cargo publish --manifest-path rust/Cargo.toml --locked --dry-run
        cargo publish --manifest-path rust/Cargo.toml --locked
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
  no-release:
    needs:
    - qualify
    - npm
    - pypi
    - crates
    if: always() && needs.qualify.outputs.ready != 'true'
    runs-on: ubuntu-latest
    steps:
    - run: |-
        echo "No release has been made"
        echo "No release has been made" >> "$GITHUB_STEP_SUMMARY"

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Validate
        run: make test
      - name: Build release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cargo package --manifest-path rust/Cargo.toml --locked
          cp rust/target/package/miilo-adapter-sdk-*.crate release/
          uv build --project python --out-dir release
          (cd typescript && npm pack --pack-destination ../release)
          tar -czf "release/miilo-protocol-${GITHUB_REF_NAME#v}.tar.gz" \
            protocol/schemas protocol/fixtures docs
          (cd release && sha256sum * > SHA256SUMS)
      - name: Attest release packages
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag

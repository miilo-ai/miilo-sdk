name: Release
permissions:
  contents: read
jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.tag || github.ref }}
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        components: rustfmt, clippy
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: typescript/package-lock.json
    - name: Build release packages
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p release
        cargo package --manifest-path rust/Cargo.toml --locked
        cp rust/target/package/miilo-adapter-sdk-*.crate release/
        uv build --project python --out-dir release
        (cd typescript && npm pack --pack-destination ../release)
        tar -czf "release/miilo-protocol-${RELEASE_TAG#v}.tar.gz" \
          protocol/schemas protocol/fixtures docs
        (cd release && sha256sum * > SHA256SUMS)
    - name: Attest release packages
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: release/*
      if: github.event.repository.private == false
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |-
        flags=()
        if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
        gh release create "$RELEASE_TAG" release/* --generate-notes "${flags[@]}" --verify-tag
      shell: bash
    needs:
    - qualify
    - publication-gate
    if: needs.publication-gate.outputs.publish == 'true'
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  qualify:
    uses: ./.github/workflows/qualify.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  publication-gate:
    needs: qualify
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.tag || github.ref }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python .github/release-tools/version.py --tag "$TAG"
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
    - name: Publishing requires the exact tag workflow context
      if: inputs.publish == true || vars.MIILO_RELEASE_ENABLED == 'true'
      shell: bash
      run: test "$GITHUB_REF" = "refs/tags/$TAG" || { echo "Run the release workflow from its version tag, not another branch"
        >&2; exit 1; }
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
    - id: existing
      run: python .github/release-tools/release_exists.py
      env:
        RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    - id: policy
      run: python .github/release-tools/publication.py
      env:
        MIILO_RELEASE_ENABLED: ${{ vars.MIILO_RELEASE_ENABLED }}
        MIILO_PUBLISH: ${{ inputs.publish }}
        RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEPENDENCIES_READY: ${{ needs.qualify.outputs.ready == 'true' && steps.existing.outputs.exists != 'true' }}
  no-release:
    needs:
    - qualify
    - publication-gate
    - github-release
    if: always() && needs.github-release.result != 'success'
    runs-on: ubuntu-latest
    steps:
    - run: |-
        echo "No release has been made"
        echo "No release has been made" >> "$GITHUB_STEP_SUMMARY"
'on':
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

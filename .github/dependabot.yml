version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /protocol
    schedule:
      interval: weekly
    groups:
      protocol-python:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    groups:
      python-sdk:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
    groups:
      typescript-sdk:
        patterns: ["*"]

[project]
name = "miilo-adapter-sdk"
version = "0.1.0"
description = "Typed Python contracts for the Miilo adapter protocol"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[package]
name = "miilo-adapter-sdk"
version = "0.1.0"
edition = "2024"
description = "Typed Rust contracts for the Miilo adapter protocol"
publish = false

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

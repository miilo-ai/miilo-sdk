[package]
name = "miilo-adapter-sdk"
version = "0.2.0"
edition = "2024"
description = "Typed Rust contracts for the Miilo adapter protocol"
license = "Apache-2.0"
repository = "https://github.com/miilo-ai/miilo-sdk"
homepage = "https://miilo.tech"
readme = "README.md"
keywords = ["agents", "automation", "observability", "protocol"]
categories = ["api-bindings", "development-tools"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

flate2 = { version = "1", optional = true }
brotli = { version = "9", optional = true }
zstd = { version = "0.14", optional = true }
sha2 = { version = "0.10", optional = true }

http = { version = "1", optional = true }
tower-http = { version = "0.6", optional = true, features = ["compression-gzip", "compression-br", "compression-zstd"] }

[features]
default = []
runtime = []
compression = ["dep:flate2", "dep:brotli", "dep:zstd", "dep:sha2"]

compression-http = ["dep:http", "dep:tower-http"]

[[example]]
name = "compression-bench"
required-features = ["compression"]

[[example]]
name = "compression-interop"
required-features = ["compression"]

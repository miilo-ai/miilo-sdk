[package]
name = "miilo-adapter-sdk"
version = "0.2.0"
edition = "2024"
description = "Typed Rust contracts for the Miilo adapter protocol"
license = "Apache-2.0"
repository = "https://github.com/miilo-ai/miilo-sdk"
homepage = "https://miilo.tech"
readme = "README.md"
keywords = ["agents", "automation", "observability", "protocol"]
categories = ["api-bindings", "development-tools"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
runtime = []
